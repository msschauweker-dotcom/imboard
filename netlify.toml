# Netlify (Git-based deploys). For drag-and-drop, upload the prebuilt `out/` folder instead.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/offgrid-config.js"
  [headers.values]
    Cache-Control = "no-cache"
